# Ambiente reproduzível para a banca — edital, item 8.8.
# Nenhum segredo neste arquivo: tudo vem do .env (copiado de .env.example).
services:
  nginx:
    # Imagem própria só para ter HTTPS desde a primeira subida: o build fabrica um certificado
    # autoassinado de reserva, e um clone limpo sobe sem nenhum arquivo de certificado (D81, item 8.8).
    build:
      context: ./docker/nginx
    image: prolink-nginx:local
    container_name: prolink-nginx
    ports:
      - "8080:80"     # HTTP: só redireciona para o HTTPS
      - "8443:8443"   # HTTPS, TLS 1.2 e 1.3. Mesma porta dentro e fora, para o redirecionamento valer dos dois lados
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificado do mkcert (scripts/gerar-certificado-local.sh), fora do versionamento. Vazio
      # num clone limpo, e aí o nginx serve o autoassinado.
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      php:
        condition: service_started
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: prolink-php
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  mariadb:
    image: mariadb:10.11
    container_name: prolink-mariadb
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-prolink}
      MARIADB_USER: ${DB_USERNAME:-prolink}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      # Usuário restrito da aplicação (D82), criado por 03-usuarios.sh. O ":?" faz o compose recusar
      # subir com a senha vazia, com a mensagem abaixo, em vez de parar a inicialização no meio.
      DB_APP_USERNAME: ${DB_APP_USERNAME:-prolink_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?defina DB_APP_PASSWORD no .env (D82)}
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      # Carga estrutural automática na primeira subida (edital 8.8: banco já carregado)
      - ./_arq/estrutura.sql:/docker-entrypoint-initdb.d/01-estrutura.sql:ro
      - ./_arq/carga-inicial.sql:/docker-entrypoint-initdb.d/02-carga-inicial.sql:ro
      # Depois da carga, porque concede por tabela a partir do information_schema (D82)
      - ./_arq/usuarios.sh:/docker-entrypoint-initdb.d/03-usuarios.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: prolink-mailpit
    ports:
      - "8025:8025"   # interface web para conferir os e-mails da RF07 em desenvolvimento
    restart: unless-stopped

volumes:
  mariadb-data:
