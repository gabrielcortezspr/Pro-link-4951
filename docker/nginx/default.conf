# HTTPS local com TLS 1.2 ou superior (D81). A proposta prometeu transporte cifrado, e até a
# véspera do Demo Day o ambiente só falava HTTP.
#
# Um server só, ouvindo nas duas portas, para que a CSP e os bloqueios de caminho abaixo existam
# em um lugar só: scripts/verificar-padrao.php lê a CSP deste arquivo e a compara com a servida, e
# dois blocos com duas cópias da política seriam duas chances de divergir.

# HSTS só vai na resposta HTTPS (em HTTP o navegador o ignora de qualquer forma). max-age de cinco
# minutos DE PROPÓSITO: HSTS vale para o host inteiro, sem distinguir porta, e um max-age de um
# ano em "localhost" obrigaria o navegador a usar https em TODO serviço local desta máquina
# (Mailpit na 8025, qualquer outro projeto) até alguém limpar à mão em chrome://net-internals.
# Em produção, com domínio próprio, o valor seria 31536000; aqui o cabeçalho existe para provar
# a política, não para prender a máquina de quem avalia. Sem includeSubDomains e sem preload.
map $scheme $prolink_hsts {
    https   "max-age=300";
    default "";
}

server {
    listen 80;
    listen 8443 ssl;
    server_name _;

    # Certificado escolhido na subida por escolher-certificado.sh: o do mkcert, se foi gerado, ou o
    # autoassinado que a imagem fabricou. Nunca falta arquivo, então o "docker compose up" de um
    # clone limpo não quebra (item 8.8).
    ssl_certificate     /etc/nginx/tls/prolink.crt;
    ssl_certificate_key /etc/nginx/tls/prolink.key;
    # TLS 1.0 e 1.1 estão depreciados (RFC 8996). Suítes do perfil "intermediate" da Mozilla:
    # só troca de chave efêmera (sigilo futuro) e cifra autenticada.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:prolink_tls:1m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # HTTP vira HTTPS. A exceção é o nome interno "nginx": os verificadores rodam dentro do
    # contêiner php e chegam aqui por http://nginx (verificar-e1.php, verificar-padrao.php), numa
    # rede do Docker que não sai da máquina. O navegador nunca manda esse Host, e quem forja o
    # cabeçalho só consegue deixar em claro a própria conexão.
    #
    # 307 e não 301: o 301 fica em cache no navegador sem prazo, e depois do Demo Day a porta 8080
    # desta máquina continuaria mandando qualquer outro projeto para a 8443. O 307 também preserva
    # o método, então um POST antigo apontado para http não vira GET no caminho.
    set $prolink_para_https 0;
    if ($scheme = http) {
        set $prolink_para_https 1;
    }
    if ($host = nginx) {
        set $prolink_para_https 0;
    }
    if ($prolink_para_https) {
        return 307 https://$host:8443$request_uri;
    }

    root /var/www/html/public;   # document root é public/, o resto fica fora do alcance
    index index.php;

    charset utf-8;
    client_max_body_size 10M;

    # Cabeçalhos de segurança (OWASP A05)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Vazio em HTTP, e o nginx não envia cabeçalho de valor vazio (ver o map no topo).
    add_header Strict-Transport-Security $prolink_hsts always;
    # Fechada em 'self': desde a E7 o Bootstrap e as duas famílias de fonte são servidas de
    # public/assets/vendor, e não há mais nenhuma origem externa em nenhuma tela. É o que a
    # Consequência da D50 registrava como pendência, e o motivo não é só segurança — o Demo Day é
    # presencial, e antes disso a aplicação aparecia sem estilo nenhum se a rede do auditório
    # falhasse ou filtrasse o CDN.
    #
    # 'unsafe-inline' fica em style-src porque cinco templates usam style="" e o Bootstrap injeta
    # estilo em componente próprio. NÃO fica em script-src: script desta aplicação mora em
    # assets/js, e é essa diretiva que carrega o peso real da CSP contra XSS.
    #
    # scripts/verificar-padrao.php compara esta lista com o que os templates carregam e falha
    # quando divergem: acrescentar origem de front sem vir aqui quebra a verificação.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Sem isto, com cgi.fix_pathinfo ligado, /assets/qualquer.png/x.php faria o PHP executar
        # o arquivo anterior do caminho. Não há upload hoje, mas PATH_UPLOADS já aponta para
        # dentro do document root, e o dia em que houver é tarde para lembrar desta linha.
        try_files $uri =404;

        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Nunca servir arquivos sensíveis, mesmo que caiam no docroot por engano
    location ~ /\.(env|git) { deny all; return 404; }
    location ~ ^/(_config\.php|_arq|vendor|src|templates)/ { deny all; return 404; }
}
