server {
    listen 80;
    server_name _;

    root /var/www/html/public;   # document root é public/, o resto fica fora do alcance
    index index.php;

    charset utf-8;
    client_max_body_size 10M;

    # Cabeçalhos de segurança (OWASP A05)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Nunca servir arquivos sensíveis, mesmo que caiam no docroot por engano
    location ~ /\.(env|git) { deny all; return 404; }
    location ~ ^/(_config\.php|_arq|vendor|src|templates)/ { deny all; return 404; }
}
