server {
    listen 80;
    server_name _;

    root /var/www/html/public;   # document root é public/, o resto fica fora do alcance
    index index.php;

    charset utf-8;
    client_max_body_size 10M;

    # Cabeçalhos de segurança (OWASP A05)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # A lista de origens externas espelha layout/base.html.twig, e só ela: Bootstrap 5 (CSS e JS)
    # vem de cdn.jsdelivr.net e as fontes de fonts.googleapis.com/fonts.gstatic.com. Escrever a
    # diretiva sem conferir o layout é o jeito mais rápido de servir a aplicação sem estilo
    # nenhum, e o navegador não avisa: bloqueio de CSP só aparece no console.
    #
    # 'unsafe-inline' fica em style-src porque cinco templates usam style="" e o Bootstrap injeta
    # estilo em componente próprio. NÃO fica em script-src: script desta aplicação mora em
    # assets/js, e é essa diretiva que carrega o peso real da CSP contra XSS.
    #
    # Quem acrescentar origem de front tem de vir aqui — scripts/verificar-padrao.php compara as
    # duas listas e falha quando divergem.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Sem isto, com cgi.fix_pathinfo ligado, /assets/qualquer.png/x.php faria o PHP executar
        # o arquivo anterior do caminho. Não há upload hoje, mas PATH_UPLOADS já aponta para
        # dentro do document root, e o dia em que houver é tarde para lembrar desta linha.
        try_files $uri =404;

        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Nunca servir arquivos sensíveis, mesmo que caiam no docroot por engano
    location ~ /\.(env|git) { deny all; return 404; }
    location ~ ^/(_config\.php|_arq|vendor|src|templates)/ { deny all; return 404; }
}
