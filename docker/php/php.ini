; Pro-Link — ajustes de runtime. Nada de segredo aqui.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php-error.log

date.timezone = America/Manaus
default_charset = UTF-8

upload_max_filesize = 8M
post_max_size = 10M
memory_limit = 256M
max_execution_time = 60

; Sessão — OWASP A07
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.cookie_secure = 0   ; vira 1 atrás de HTTPS (homologação/produção)

opcache.enable = 1
opcache.validate_timestamps = 1
